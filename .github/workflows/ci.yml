name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'LICENSE']
  workflow_dispatch:
    inputs:
      lisps:
        description: Implementations to test
        type: choice
        options: [all, sbcl, ecl, ccl]
        default: all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbcl:
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","sbcl"]'), inputs.lisps)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          lisp: sbcl-bin
      - name: Test
        run: ros -L sbcl-bin -Q -l tests/ci.lisp
      - name: Build the lasm binary
        run: |
          ros build lasm.ros
          ./lasm run tests/fixtures/cli/counter.asm -m tests/fixtures/cli/sixtyfoo.lisp

  # ECL builds from source and is slow, so these run on request or on a tag.
  portability:
    if: github.event_name == 'workflow_dispatch' && inputs.lisps != 'sbcl' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lisp: ${{ fromJSON(inputs.lisps == 'ecl' && '["ecl"]' || inputs.lisps == 'ccl' && '["ccl-bin"]' || '["ecl","ccl-bin"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          lisp: ${{ matrix.lisp }}
      - name: Test
        run: ros -L ${{ matrix.lisp }} -Q -l tests/ci.lisp
