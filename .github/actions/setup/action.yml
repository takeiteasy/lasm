name: Set up Lisp
description: Roswell with one Lisp, its Quicklisp at ~/quicklisp and the timer dependency
inputs:
  lisp:
    description: Roswell implementation name
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ~/.roswell
        key: roswell-${{ runner.os }}-${{ inputs.lisp }}-${{ hashFiles('lasm.asd') }}
        restore-keys: roswell-${{ runner.os }}-${{ inputs.lisp }}-
    - name: Install Roswell and ${{ inputs.lisp }}
      shell: bash
      env:
        LISP: ${{ inputs.lisp }}
      run: |
        curl -fsSL https://raw.githubusercontent.com/roswell/roswell/release/scripts/install-for-ci.sh | sh
        echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"
        ros install "$LISP"
        ros use "$LISP"
    - name: Link Quicklisp and the timer
      shell: bash
      run: |
        # Bare Lisps load ~/quicklisp/setup.lisp, and Roswell's hook in it needs Roswell's package.
        ln -sfn ~/.roswell/lisp/quicklisp ~/quicklisp
        rm -f ~/quicklisp/local-init/roswell.lisp
        git clone --depth 1 https://github.com/takeiteasy/trivial-high-precision-timer ~/quicklisp/local-projects/trivial-high-precision-timer
        ln -sfn "$GITHUB_WORKSPACE" ~/quicklisp/local-projects/lasm
        ros -Q -e '(ql:quickload (list :eclector :cffi :fiveam :closer-mop))' -q
    - name: Put ECL on PATH
      if: inputs.lisp == 'ecl'
      shell: bash
      run: |
        # The example scripts start bare `ecl`.
        dirname "$(find ~/.roswell/impls -path '*/bin/ecl' -type f | head -n 1)" >> "$GITHUB_PATH"
