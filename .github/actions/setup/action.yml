name: Set up Lisp
description: Roswell with one Lisp, a Quicklisp at ~/quicklisp and the timer dependency
inputs:
  lisp:
    description: Roswell implementation name
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ~/.roswell
        key: roswell-${{ runner.os }}-${{ inputs.lisp }}-${{ hashFiles('lasm.asd') }}
        restore-keys: roswell-${{ runner.os }}-${{ inputs.lisp }}-
    - name: Install Roswell and ${{ inputs.lisp }}
      shell: bash
      env:
        LISP: ${{ inputs.lisp }}
      run: |
        curl -fsSL https://raw.githubusercontent.com/roswell/roswell/release/scripts/install-for-ci.sh | sh
        echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"
        ros install "$LISP"
        ros use "$LISP"
    - name: Install Quicklisp and the timer
      shell: bash
      run: |
        # A standalone Quicklisp: the one inside ~/.roswell needs Roswell's package to load.
        curl -fsSLO https://beta.quicklisp.org/quicklisp.lisp
        ros -Q -e '(load "quicklisp.lisp")' -e '(quicklisp-quickstart:install)' -q
        git clone --depth 1 https://github.com/takeiteasy/trivial-high-precision-timer ~/quicklisp/local-projects/trivial-high-precision-timer
        ln -sfn "$GITHUB_WORKSPACE" ~/quicklisp/local-projects/lasm
        ln -sfn ~/quicklisp/local-projects/trivial-high-precision-timer ~/.roswell/local-projects/trivial-high-precision-timer
        ln -sfn "$GITHUB_WORKSPACE" ~/.roswell/local-projects/lasm
        ros -Q -e '(load (merge-pathnames "quicklisp/setup.lisp" (user-homedir-pathname)))' \
          -e '(ql:quickload (list :eclector :cffi :fiveam :closer-mop))' -q
    - name: Put the Lisp on PATH
      shell: bash
      run: |
        # The example scripts start bare `ecl`, so its directory must be on PATH.
        bin=$(dirname "$(find ~/.roswell/impls -path '*/bin/*' -type f \( -name ecl -o -name sbcl \) | head -n 1)")
        echo "$bin" >> "$GITHUB_PATH"
